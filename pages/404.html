<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — MediPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/animations.css">
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:var(--space-6);">
  <div>
    <div class="gradient-text" style="font-family:var(--font-display);font-size:var(--fs-5xl);font-weight:700;">404</div>
    <h1 style="margin-top:var(--space-4);">This page took a dose and wandered off.</h1>
    <p style="margin-top:var(--space-3);max-width:400px;margin-inline:auto;">The page you're looking for doesn't exist, or has moved somewhere new.</p>
    <a href="../index.html" class="btn btn-primary" style="margin-top:var(--space-8);">Back to Home</a>
  </div>
</div>
<script>
document.documentElement.setAttribute('data-theme', localStorage.getItem('medipulse:theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
</body>
</html>
